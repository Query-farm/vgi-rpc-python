services:
  server-tool:
    image: ${VGI_TAILNET_IMAGE:-vgi-rpc-tailnet:local}
    profiles: ["interop"]
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server:
        condition: service_healthy

  cpp-client-direct:
    image: ${VGI_TAILNET_CPP_IMAGE:-vgi-rpc-tailnet-cpp:local}
    profiles: ["interop"]
    network_mode: service:tailscale-client
    depends_on:
      tailscale-client:
        condition: service_healthy

  cpp-client-socks:
    image: ${VGI_TAILNET_CPP_IMAGE:-vgi-rpc-tailnet-cpp:local}
    profiles: ["interop"]
    depends_on:
      tailscale-socks:
        condition: service_healthy

  cpp-worker-direct:
    image: ${VGI_TAILNET_CPP_IMAGE:-vgi-rpc-tailnet-cpp:local}
    profiles: ["interop"]
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server:
        condition: service_healthy
    volumes:
      - server-socket:/var/run/tailscale:ro
    command:
      - server-tcp
      - --host
      - 0.0.0.0
      - --port
      - "19400"
      - --issuer
      - ${TAILNET_ISSUER:-tailnet:vgi-ci}
      - --localapi-socket
      - /var/run/tailscale/tailscaled.sock
      - --expected-capability
      - ${TAILNET_EXPECTED_CAPABILITY:-}
      - --expected-tag
      - ${TAILNET_EXPECTED_CLIENT_TAG:-tag:vgi-ci-client}

  cpp-worker-http:
    image: ${VGI_TAILNET_CPP_IMAGE:-vgi-rpc-tailnet-cpp:local}
    profiles: ["interop"]
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server:
        condition: service_healthy
    command:
      - server-http
      - --host
      - 127.0.0.1
      - --port
      - "18080"
      - --issuer
      - ${TAILNET_ISSUER:-tailnet:vgi-ci}
      - --expected-capability
      - ${TAILNET_EXPECTED_CAPABILITY:-}

  cpp-worker-proxy-v2:
