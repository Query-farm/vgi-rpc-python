name: Cross-language real Tailnet integration

on:
  workflow_dispatch:
    inputs:
      tailscale_channel:
        description: Official Tailscale container channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - unstable

permissions:
  contents: read

concurrency:
  group: vgi-rpc-cross-language-real-tailnet
  cancel-in-progress: false

jobs:
  go-rust:
    name: Go and Rust bidirectional qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tailnet-integration
    env:
      TAILSCALE_IMAGE: tailscale/tailscale:${{ inputs.tailscale_channel }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILNET_ISSUER: ${{ vars.TAILNET_ISSUER }}
      TAILNET_EXPECTED_CAPABILITY: ${{ vars.TAILNET_EXPECTED_CAPABILITY }}
      TAILNET_EXPECTED_CLIENT_TAG: ${{ vars.TAILNET_EXPECTED_CLIENT_TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vgi-rpc-python

      - name: Read pinned implementation revisions
        id: revisions
        working-directory: vgi-rpc-python
        shell: bash
        run: |
          go_revision="$(jq -r .go tests/tailnet/revisions.json)"
          rust_revision="$(jq -r .rust tests/tailnet/revisions.json)"
          [[ "$go_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$rust_revision" =~ ^[0-9a-f]{40}$ ]]
          echo "go=$go_revision" >> "$GITHUB_OUTPUT"
          echo "rust=$rust_revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-rpc-go
          path: vgi-rpc-go
          ref: ${{ steps.revisions.outputs.go }}

      - uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-rpc-rust
          path: vgi-rpc-rust
          ref: ${{ steps.revisions.outputs.rust }}

      - name: Report resolved implementation revisions
        shell: bash
        run: |
          go_revision="$(git -C vgi-rpc-go rev-parse HEAD)"
          rust_revision="$(git -C vgi-rpc-rust rev-parse HEAD)"
          test "$go_revision" = "${{ steps.revisions.outputs.go }}"
          test "$rust_revision" = "${{ steps.revisions.outputs.rust }}"
          {
            echo "### Cross-language implementation revisions"
            echo
            echo "| Implementation | Revision |"
            echo "| --- | --- |"
            echo "| Go | \`$go_revision\` |"
            echo "| Rust | \`$rust_revision\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check kernel networking support
        run: |
          test -c /dev/net/tun
          docker compose version

      - name: Run bidirectional real-Tailnet matrix
        working-directory: vgi-rpc-python
        env:
          TAILNET_GO_SOURCE: ${{ github.workspace }}/vgi-rpc-go
          TAILNET_RUST_SOURCE: ${{ github.workspace }}/vgi-rpc-rust
        run: tests/tailnet/run_cross_language.sh
