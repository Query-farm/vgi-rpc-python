name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Fail if type-precision drops below this percentage (mypy --any-exprs-report)
  MIN_TYPE_PRECISION: "95"


jobs:
  bare-install:
    # vgi-rpc with no extras: `import vgi_rpc` and the byte-stream transports
    # must work, and so must the fake vendor's console script (other repos'
    # lanes run it via `uvx --from git+...` without extras).
    name: Bare install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install vgi-rpc without extras
        run: |
          uv venv --python 3.13 /tmp/bare
          VIRTUAL_ENV=/tmp/bare uv pip install .

      - name: Import, pipe stream with a StateRef, fake vendor --help
        run: |
          /tmp/bare/bin/python -I -c "import vgi_rpc, vgi_rpc.state_ref, vgi_rpc.object_cache"
          /tmp/bare/bin/python -I scripts/check_bare_install.py
          /tmp/bare/bin/vgi-rpc-fake-vendor --help

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      # Windows runs at -n 2 rather than the -n auto in pyproject's addopts.
      # The suite spawns real servers and talks to them over loopback, and on
      # Windows a connection aborted by the peer is a hard WSAECONNABORTED
      # (WinError 10053) where POSIX quietly delivers the response instead. At
      # -n auto that shows up as an intermittent failure somewhere in
      # TestExternalLocation -- a different test each run, which is the
      # signature of contention rather than of a broken test. Halving the
      # concurrency keeps the wall-clock win without sitting on that edge.
      # A recurrence at -n 2 would mean the race is not purely load-driven and
      # is worth chasing on a Windows box rather than papering over here.
      - name: Run tests with coverage
        run: >
          uv run --python ${{ matrix.python-version }} pytest
          ${{ matrix.os == 'windows-latest' && '-n 2' || '' }}
          --cov=vgi_rpc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  s3-compat:
    # Direct S3 storage against a real, SigV4-validating S3-compatible server:
    # RustFS (the same image vgi-rpc-java's storage-integration job uses) over
    # plain http (path-style) and over TLS, with static keys and with STS
    # AssumeRole session tokens (tests/test_storage_env.py, plus the throttle
    # suite's S3 case). Skipped S3 cases fail the job.
    name: Direct S3 (RustFS)
    needs: lint
    runs-on: ubuntu-latest
    env:
      RUSTFS_IMAGE: ghcr.io/rustfs/rustfs@sha256:29c02251c085cb04edce556304a9ec0f8fba0c40300266cf4f3d953783fe2450
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Start RustFS (http :9000, TLS :9443)
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=127.0.0.1 \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -keyout "$RUNNER_TEMP/certs/rustfs_key.pem" -out "$RUNNER_TEMP/certs/rustfs_cert.pem"
          chmod 644 "$RUNNER_TEMP"/certs/*
          common=(-e RUSTFS_ACCESS_KEY=vgitestadmin -e RUSTFS_SECRET_KEY=vgitestsecret123 -e RUSTFS_CONSOLE_ENABLE=false)
          docker run -d --name rustfs-http -p 127.0.0.1:9000:9000 "${common[@]}" "$RUSTFS_IMAGE"
          docker run -d --name rustfs-tls -p 127.0.0.1:9443:9000 -v "$RUNNER_TEMP/certs:/certs:ro" \
            -e RUSTFS_TLS_PATH=/certs "${common[@]}" "$RUSTFS_IMAGE"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/health >/dev/null \
              && curl -sf --cacert "$RUNNER_TEMP/certs/rustfs_cert.pem" https://127.0.0.1:9443/health >/dev/null \
              && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/health
          curl -sf --cacert "$RUNNER_TEMP/certs/rustfs_cert.pem" https://127.0.0.1:9443/health

      - name: Install dependencies
        run: uv sync --all-extras --python 3.13

      - name: Run direct-storage tests against RustFS
        env:
          VGI_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          VGI_TEST_S3_TLS_ENDPOINT: https://127.0.0.1:9443
          VGI_TEST_S3_ACCESS_KEY: vgitestadmin
          VGI_TEST_S3_SECRET_KEY: vgitestsecret123
        run: |
          export VGI_TEST_S3_CA_FILE="$RUNNER_TEMP/certs/rustfs_cert.pem"
          set -o pipefail
          # -rs lists skips: an S3 case that skips here is a lane failure in disguise.
          uv run pytest -o addopts= -p no:cacheprovider -rs --timeout=120 \
            tests/test_storage_env.py tests/test_storage_throttle.py 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          if grep -E "^SKIPPED.*VGI_TEST_S3" "$RUNNER_TEMP/pytest.out"; then
            echo "::error::S3-compatible server tests skipped"; exit 1
          fi

      - name: RustFS logs
        if: failure()
        run: |
          docker logs rustfs-http 2>&1 | tail -40
          docker logs rustfs-tls 2>&1 | tail -40

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      # Docstring consistency: documented args/attributes must match the code.
      # Config lives in pyproject.toml ([tool.pydoclint]); vgi_rpc/ is fully
      # clean with no baseline, so any new violation fails immediately.
      # Run isolated via uvx: pydoclint pulls docstring-parser-fork, which
      # collides with the canonical docstring-parser in the project venv, so it
      # is deliberately not a project dependency (see pyproject.toml). --python
      # 3.13 is required so the parser understands the package's 3.13 syntax.
      - name: Docstring lint (pydoclint)
        run: uvx --python 3.13 --from pydoclint==0.8.7 pydoclint vgi_rpc/

      - name: Type check (mypy)
        run: uv run mypy vgi_rpc/ --any-exprs-report mypy-type-report

      - name: Type precision report
        if: always()
        shell: bash
        run: |
          if [ -f mypy-type-report/any-exprs.txt ]; then
            echo "## Mypy Type Precision" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Convert the fixed-width report to a markdown table
            echo "| Module | Anys | Exprs | Coverage |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-----:|------:|---------:|" >> "$GITHUB_STEP_SUMMARY"
            # Skip header (2 lines) and separator, process data lines
            awk 'NR > 2 { if (index($0, "---") == 0 && NF >= 4) printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }' \
              mypy-type-report/any-exprs.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Extract total coverage percentage and check threshold
            total_pct=$(awk '/Total/ { gsub(/%/, "", $4); print $4 }' mypy-type-report/any-exprs.txt)
            echo "Type precision: **${total_pct}%** (minimum: ${MIN_TYPE_PRECISION}%)" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$total_pct" ]; then
              below=$(echo "$total_pct < $MIN_TYPE_PRECISION" | bc -l)
              if [ "$below" = "1" ]; then
                echo ""
                echo "> **Type precision ${total_pct}% is below the ${MIN_TYPE_PRECISION}% threshold.**" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Type precision ${total_pct}% is below the ${MIN_TYPE_PRECISION}% minimum"
                exit 1
              fi
            fi
          fi

      - name: Type check (ty)
        run: uv run ty check vgi_rpc/
