[project]
name = "vgi-rpc-sync"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "vgi-rpc[otel,http]>=0.1.27",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[tool.uv.sources]
# The local working copy, not a release: this tool's whole job is to compare
# the ports against what the reference *currently* does, so pinning it to a
# published version would compare them against the past.
vgi-rpc = { path = "../vgi-rpc-python", editable = true }
